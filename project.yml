name: Paste
options:
  bundleIdPrefix: com.eli
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "5Q5QT76MJU"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

targets:
  Paste:
    type: application
    platform: macOS
    sources:
      - path: Paste
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_NAME: Paste
        PRODUCT_BUNDLE_IDENTIFIER: com.eli.Paste
        INFOPLIST_FILE: Paste/Info.plist
        CODE_SIGN_ENTITLEMENTS: Paste/Paste.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: paste
        COMBINE_HIDPI_IMAGES: YES
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lsqlite3"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

schemes:
  Paste:
    build:
      targets:
        Paste: all
    run:
      config: Debug
