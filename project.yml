name: Paste
options:
  bundleIdPrefix: com.eli
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "7558SBX9GQ"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "2A88CD7D51E221BC525FCB7F75C24352D2F1BEC1"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Paste:
    type: application
    platform: macOS
    sources:
      - path: Paste
    settings:
      base:
        PRODUCT_NAME: Paste
        PRODUCT_BUNDLE_IDENTIFIER: com.eli.Paste
        INFOPLIST_FILE: Paste/Info.plist
        CODE_SIGN_ENTITLEMENTS: Paste/Paste.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: paste
        COMBINE_HIDPI_IMAGES: YES
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lsqlite3"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

schemes:
  Paste:
    build:
      targets:
        Paste: all
    run:
      config: Debug
